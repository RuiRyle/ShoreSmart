<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShoreSmart | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ocean: #0057a8; --sky: #00b4d8;
      --dark: #0a1628; --muted: #6b7c93;
      --border: rgba(255,255,255,0.1);
      --admin: #7c3aed; --admin-light: rgba(124,58,237,0.15);
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 25% 50%, rgba(124,58,237,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 30%, rgba(0,87,168,0.3) 0%, transparent 50%),
        linear-gradient(135deg, #0a1628 0%, #100d2a 50%, #0a1628 100%);
      z-index: 0;
    }
    .page-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; padding: 20px;
      animation: riseIn 0.5s ease both;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo { font-family: 'Playfair Display', serif; font-size: 28px; color: #fff; }
    .brand-logo span { color: var(--sky); }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--admin-light);
      border: 1px solid rgba(124,58,237,0.35);
      color: #a78bfa; font-size: 12px; font-weight: 600;
      padding: 5px 14px; border-radius: 100px; margin-bottom: 16px;
    }
    .card-title { font-family: 'Playfair Display', serif; font-size: 24px; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: var(--muted); margin-bottom: 26px; line-height: 1.5; }
    .alert {
      padding: 10px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 500; margin-bottom: 16px; display: none;
    }
    .alert.error { background: rgba(229,62,62,0.12); border: 1px solid rgba(229,62,62,0.3); color: #fc8181; }
    label {
      display: block; font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.4); text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 6px; margin-top: 14px;
    }
    input {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 12px 16px; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: all 0.2s;
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:focus { border-color: #a78bfa; background: rgba(124,58,237,0.08); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .btn-submit {
      width: 100%; padding: 14px; margin-top: 22px;
      background: linear-gradient(135deg, #5b21b6, #7c3aed);
      color: #fff; border: none; border-radius: 14px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(124,58,237,0.35); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .footer-links a { color: var(--sky); text-decoration: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page-wrapper">
  <div class="brand">
    <div class="brand-logo">Shore<span>Smart</span></div>
    <div class="brand-sub">Administration Portal</div>
  </div>
  <div class="card">
    <div class="admin-badge">🛡️ Admin Access</div>
    <h1 class="card-title">Admin sign in</h1>
    <p class="card-desc">Restricted to authorized ShoreSmart administrators only.</p>
    <div id="alert-box" class="alert"></div>
    <form id="login-form">
      <label>Email address</label>
      <input type="email" id="email" placeholder="admin@shoresmart.com" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="Admin password" required>
      <button type="submit" class="btn-submit" id="submit-btn">Sign In as Admin</button>
    </form>
    <div class="footer-links" style="margin-top:18px;">
      <a href="login.html">← Back to guest login</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAv74YNJR8FXhQ-cbvDW-yBaCECyS_D30",
    authDomain: "shoresmart-5fc2d.firebaseapp.com",
    projectId: "shoresmart-5fc2d",
    storageBucket: "shoresmart-5fc2d.firebasestorage.app",
    messagingSenderId: "1035637427343",
    appId: "1:1035637427343:web:4f8728e2efe1c62058f4fa"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ── Hardcoded admin accounts ──
  // Add more emails here if you ever need multiple admins
  const ADMIN_EMAILS = [
    'admin@gmail.com'
  ];

  const alertBox  = document.getElementById('alert-box');
  const submitBtn = document.getElementById('submit-btn');

  function showAlert(msg, type) {
    alertBox.textContent = msg;
    alertBox.className = `alert ${type}`;
    alertBox.style.display = 'block';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';

    try {
      // Step 1: Sign in with Firebase Auth
      const cred = await signInWithEmailAndPassword(auth, email, password);

      // Step 2: Check if the email is in the admin list
      if (!ADMIN_EMAILS.includes(cred.user.email.toLowerCase())) {
        await signOut(auth);
        throw new Error('Access denied. This account is not an admin.');
      }

      // Step 3: Redirect to admin dashboard
      window.location.href = 'admin-dashboard.html';

    } catch (err) {
      let msg = 'Invalid email or password.';
      if (err.message === 'Access denied. This account is not an admin.') {
        msg = err.message;
      }
      showAlert(msg, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In as Admin';
    }
  });
</script>
</body>
</html>
